<!doctype html>
<html lang="en" data-theme="dark" data-asset="20261017nx" data-pieces="neo" data-board="green">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111827">
  <title>Chess</title>
  <link rel="stylesheet" href="/styles.css?v=20261017nx">
  <style>
    /* Inline boot splash — always visible until JS reveals gate/app (never a blank black WebView) */
    html, body { margin: 0; min-height: 100%; min-height: 100dvh; background: radial-gradient(ellipse at 50% 42%, #1a2740 0%, #111827 62%, #0b1220 100%); color: var(--text, #fff); }
    #boot {
      position: fixed; inset: 0; z-index: 1000;
      display: grid; place-content: center; justify-items: center; gap: 16px;
      background: radial-gradient(ellipse at 50% 42%, #1a2740 0%, #111827 62%, #0b1220 100%);
      color: #e5e7eb; font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    #boot[hidden] { display: none !important; }
    #boot .boot-mark {
      position: relative; width: 96px; height: 96px;
      display: grid; place-items: center;
    }
    #boot .boot-glow {
      position: absolute; inset: 8px; border-radius: 50%;
      background: radial-gradient(circle, rgba(84,164,247,0.35) 0%, transparent 70%);
      animation: boot-glow 2.2s ease-in-out infinite;
    }
    #boot .boot-orbit {
      position: absolute; inset: 0; border-radius: 50%;
      animation: boot-orbit 2.4s linear infinite;
    }
    #boot .boot-orbit i {
      position: absolute; top: 2px; left: 50%; width: 8px; height: 8px; margin-left: -4px;
      border-radius: 50%; background: #54a4f7;
      box-shadow: 0 0 10px rgba(84,164,247,0.9);
    }
    #boot .boot-orbit i:nth-child(2) { top: auto; bottom: 2px; background: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.85); }
    #boot .boot-orbit i:nth-child(3) { top: 50%; left: 2px; margin: -4px 0 0; background: #34d399; box-shadow: 0 0 10px rgba(52,211,153,0.85); }
    #boot .boot-ic {
      position: relative; z-index: 1;
      width: 62px; height: 62px; border-radius: 20px;
      background: linear-gradient(160deg, #6bb4ff 0%, #3b82f6 48%, #2563eb 100%);
      display: grid; place-items: center; font-size: 30px; line-height: 1;
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.45), 0 1px 0 rgba(255,255,255,0.25) inset;
      animation: boot-float 1.8s ease-in-out infinite;
    }
    #boot .boot-label {
      margin: 4px 0 0; font-weight: 750; font-size: 17px; letter-spacing: -0.01em;
      color: #e5e7eb; text-align: center;
    }
    #boot .boot-sub {
      margin: -6px 0 0; font-size: 13px; font-weight: 600; color: #94a3b8; text-align: center;
    }
    #boot .boot-bar {
      width: min(180px, 48vw); height: 3px; border-radius: 99px;
      background: rgba(148, 163, 184, 0.18); overflow: hidden; margin-top: 2px;
    }
    #boot .boot-bar > i {
      display: block; height: 100%; width: 42%; border-radius: 99px;
      background: linear-gradient(90deg, #54a4f7, #93c5fd, #fbbf24);
      animation: boot-bar 1.15s ease-in-out infinite;
    }
    /* animation variants (admin-selectable) */
    #boot[data-anim="pulse"] .boot-orbit { display: none; }
    #boot[data-anim="pulse"] .boot-ic { animation: boot-pulse 1.4s ease-in-out infinite; }
    #boot[data-anim="bars"] .boot-orbit { display: none; }
    #boot[data-anim="bars"] .boot-glow { animation: none; opacity: 0.55; }
    #boot[data-anim="bars"] .boot-ic { animation: none; }
    #boot.boot-fail { cursor: pointer; }
    #boot.boot-fail .boot-orbit, #boot.boot-fail .boot-glow, #boot.boot-fail .boot-bar > i { animation: none; }
    #boot.boot-fail .boot-ic {
      animation: none;
      background: linear-gradient(160deg, #64748b, #334155);
      box-shadow: none;
    }
    @keyframes boot-orbit { to { transform: rotate(360deg); } }
    @keyframes boot-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    @keyframes boot-glow {
      0%, 100% { opacity: 0.45; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes boot-bar {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
    /* Android: drop boot orbit/glow immediately (before modules) */
    html[data-android="1"] #boot .boot-glow,
    html[data-android="1"] #boot .boot-orbit,
    html[data-android="1"] #boot .boot-ic { animation: none !important; }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Earliest possible ready/expand — don't wait for modules or /me */
    (function () {
      try {
        var tw = window.Telegram && window.Telegram.WebApp;
        var ua = navigator.userAgent || '';
        var plat = String((tw && tw.platform) || '').toLowerCase();
        if (plat === 'android' || /Android/i.test(ua)) {
          document.documentElement.setAttribute('data-android', '1');
        }
        if (plat === 'ios' || /iPhone|iPad|iPod/i.test(ua)) {
          document.documentElement.setAttribute('data-ios', '1');
        }
        if (!tw) return;
        tw.ready();
        try { tw.expand(); } catch (e) {}
        try { if (tw.disableVerticalSwipes) tw.disableVerticalSwipes(); } catch (e) {}
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="boot" role="status" aria-live="polite" data-anim="orbit">
    <div class="boot-mark" aria-hidden="true">
      <div class="boot-glow"></div>
      <div class="boot-orbit"><i></i><i></i><i></i></div>
      <div class="boot-ic">♟</div>
    </div>
    <p class="boot-label" id="boot-label">O'yin yuklanmoqda</p>
    <p class="boot-sub" id="boot-sub">Iltimos kuting…</p>
    <div class="boot-bar" aria-hidden="true"><i></i></div>
  </div>

  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="gate-icon">♟</div>
      <h1>Open from Telegram</h1>
      <p>This app works inside Telegram. Open the bot and tap <b>Play</b>.</p>
      <button type="button" class="btn gate-retry" data-gate-retry hidden>Try again</button>
    </div>
  </div>

  <main id="app" hidden>
    <div id="bg" aria-hidden="true"></div>
    <div id="pager">
      <div id="track">
        <section class="page" data-page="play"></section>
        <section class="page" data-page="puzzles"></section>
        <section class="page" data-page="rankings"></section>
        <section class="page" data-page="live"></section>
        <section class="page" data-page="profile"></section>
      </div>
    </div>
    <div id="dock">
      <div id="play-sticky" aria-hidden="true"></div>
      <nav id="nav" aria-label="Main"><span id="nav-ind"></span></nav>
    </div>
    <div id="game" class="screen game" aria-hidden="true"></div>
    <div id="screen" class="screen" aria-hidden="true"></div>
    <div id="sheet-root"></div>
    <div id="toast" role="status"></div>
  </main>
  <!-- Light entry: /me + hide splash, then dynamic-import heavy app.js -->
  <script type="module" src="/js/entry.js?v=20261017nx"></script>
  <script>
    (function () {
      // Wake Render origin early (cold start) while splash paints
      try { fetch('/healthz', { cache: 'no-store', credentials: 'omit' }).catch(function () {}); } catch (e) {}
      var DEFAULTS = {
        en: { title: 'Loading game', subtitle: 'Please wait…' },
        ru: { title: 'Игра загружается', subtitle: 'Подождите…' },
        uz: { title: "O'yin yuklanmoqda", subtitle: 'Iltimos kuting…' },
        uzc: { title: 'Ўйин юкланмоқда', subtitle: 'Илтимос кутинг…' }
      };
      function detectLang() {
        try {
          var saved = localStorage.getItem('chess_lang');
          if (saved && DEFAULTS[saved]) return saved;
        } catch (e) {}
        try {
          var tw = window.Telegram && window.Telegram.WebApp;
          var code = (tw && tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code) || '';
          code = String(code).toLowerCase();
          if (code.indexOf('ru') === 0) return 'ru';
          if (code.indexOf('uz') === 0) return 'uz';
        } catch (e) {}
        return 'uz';
      }
      function applyCopy(entry, anim) {
        var b = document.getElementById('boot');
        if (!b || b.classList.contains('boot-fail')) return;
        var label = document.getElementById('boot-label');
        var sub = document.getElementById('boot-sub');
        if (label && entry && entry.title) label.textContent = entry.title;
        if (sub) {
          if (entry && entry.subtitle) { sub.textContent = entry.subtitle; sub.hidden = false; }
          else { sub.textContent = ''; sub.hidden = true; }
        }
        if (anim) b.setAttribute('data-anim', anim);
      }
      var lang = detectLang();
      applyCopy(DEFAULTS[lang] || DEFAULTS.uz, 'orbit');
      try {
        fetch('/api/public/boot-splash', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data || !data.splash) return;
            var entry = data.splash[lang] || data.splash.uz || data.splash.en;
            applyCopy(entry, data.splash.animation || 'orbit');
          })
          .catch(function () {});
      } catch (e) {}

      function bootEl() { return document.getElementById('boot'); }
      function bootStillUp() {
        var b = bootEl();
        return !!(b && document.body.contains(b) && !b.hidden && b.style.display !== 'none');
      }
      function forceLeaveSplash() {
        var b = bootEl();
        if (!b || !document.body.contains(b)) return;
        if (b.classList.contains('boot-fail')) return;
        var tw = window.Telegram && window.Telegram.WebApp;
        try {
          b.hidden = true;
          b.setAttribute('hidden', '');
          b.style.setProperty('display', 'none', 'important');
          b.remove();
        } catch (e) {}
        var app = document.getElementById('app');
        var gate = document.getElementById('gate');
        if (tw && tw.initData) {
          if (gate) gate.hidden = true;
          if (app) { app.hidden = false; app.removeAttribute('hidden'); }
        } else {
          if (app) app.hidden = true;
          if (gate) gate.hidden = false;
        }
      }
      function failBoot(msg) {
        var b = bootEl();
        if (!b || !bootStillUp() || b.classList.contains('boot-fail')) return;
        b.classList.add('boot-fail');
        b.innerHTML =
          '<div class="boot-mark" aria-hidden="true"><div class="boot-glow"></div><div class="boot-ic">♟</div></div>' +
          '<p class="boot-label">' + (msg || 'Ilova ochilmadi') + '</p>' +
          '<p class="boot-sub">Qayta urinish uchun bosing</p>';
        b.onclick = function () { location.reload(); };
      }
      // Only force-leave when home already painted (do not flash empty shell at 2.5s)
      function forceLeaveIfHomeReady() {
        var play = document.querySelector('.page[data-page="play"]');
        if (play && play.childElementCount > 0) forceLeaveSplash();
      }
      setTimeout(forceLeaveIfHomeReady, 4000);
      setTimeout(forceLeaveIfHomeReady, 8000);
      window.addEventListener('error', function (ev) {
        if (!bootStillUp()) return;
        var src = '';
        try {
          src = String((ev && ev.filename) || (ev && ev.target && (ev.target.src || ev.target.href)) || '');
        } catch (e) { src = ''; }
        if (src.indexOf('/js/entry.js') === -1) return;
        failBoot('Yuklashda xato');
      }, true);
      setTimeout(function () {
        if (!bootStillUp()) return;
        var play = document.querySelector('.page[data-page="play"]');
        if (play && play.childElementCount > 0) forceLeaveSplash();
        else failBoot('Juda uzoq kutildi');
      }, 42000);
    })();
  </script>
</body>
</html>
