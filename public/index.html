<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Chess</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="gate-icon">♟</div>
      <h1>Open from Telegram</h1>
      <p>This app works inside Telegram. Open the bot and tap <b>Play</b>.</p>
    </div>
  </div>

  <main id="app" hidden>
    <div id="pager">
      <div id="track">
        <section class="page" data-page="play"></section>
        <section class="page" data-page="live"></section>
        <section class="page" data-page="friends"></section>
        <section class="page" data-page="profile"></section>
      </div>
    </div>
    <div id="dock">
      <nav id="nav" aria-label="Main"><span id="nav-ind"></span></nav>
      <button id="fab" aria-label="New game">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="game" class="screen game" aria-hidden="true"></div>
    <div id="screen" class="screen" aria-hidden="true"></div>
    <div id="sheet-root"></div>
    <div id="toast" role="status"></div>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
