<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Obuna</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="gate-icon">↗</div>
      <h1>Open from Telegram</h1>
      <p>This app works inside Telegram. Open the bot and tap the <b>Open</b> button.</p>
    </div>
  </div>

  <main id="app" hidden>
    <div id="pager">
      <div id="track">
        <section class="page" data-page="home"></section>
        <section class="page" data-page="expenses"></section>
        <section class="page" data-page="subs"></section>
        <section class="page" data-page="calendar"></section>
        <section class="page" data-page="profile"></section>
      </div>
    </div>

    <div id="dock">
      <nav id="nav" aria-label="Main">
        <span id="nav-ind"></span>
      </nav>
      <button id="fab" aria-label="Add">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div id="screen" class="screen" aria-hidden="true"></div>
    <div id="sheet-root"></div>
    <div id="toast" role="status"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
