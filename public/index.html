<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111827">
  <title>Chess</title>
  <link rel="stylesheet" href="/styles.css?v=20261015f">
  <link rel="modulepreload" href="/js/inbox.js?v=20261015f">
  <style>
    /* Inline boot splash — always visible until JS reveals gate/app (never a blank black WebView) */
    html, body { margin: 0; min-height: 100%; min-height: 100dvh; background: var(--bg, #111827); color: var(--text, #fff); }
    #boot {
      position: fixed; inset: 0; z-index: 1000;
      display: grid; place-content: center; justify-items: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 42%, #1a2740 0%, #111827 62%, #0b1220 100%);
      color: #e5e7eb; font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    #boot[hidden] { display: none !important; }
    #boot .boot-mark {
      position: relative; width: 88px; height: 88px;
      display: grid; place-items: center;
    }
    #boot .boot-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid rgba(84, 164, 247, 0.18);
      border-top-color: #54a4f7;
      border-right-color: rgba(84, 164, 247, 0.55);
      animation: boot-spin 0.9s linear infinite;
    }
    #boot .boot-ring::after {
      content: ""; position: absolute; inset: 7px; border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: rgba(251, 191, 36, 0.7);
      animation: boot-spin 1.35s linear infinite reverse;
    }
    #boot .boot-ic {
      position: relative; z-index: 1;
      width: 58px; height: 58px; border-radius: 18px;
      background: linear-gradient(160deg, #6bb4ff 0%, #3b82f6 48%, #2563eb 100%);
      display: grid; place-items: center; font-size: 28px; line-height: 1;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.45), 0 1px 0 rgba(255,255,255,0.25) inset;
      animation: boot-pulse 1.6s ease-in-out infinite;
    }
    #boot .boot-label {
      margin: 0; font-weight: 750; font-size: 16px; letter-spacing: -0.01em;
      color: #e5e7eb;
    }
    #boot .boot-sub {
      margin: -8px 0 0; font-size: 13px; font-weight: 600; color: #94a3b8;
    }
    #boot .boot-dots { display: flex; gap: 6px; height: 10px; align-items: center; }
    #boot .boot-dots i {
      width: 7px; height: 7px; border-radius: 50%; background: #54a4f7;
      opacity: 0.35; animation: boot-dot 1.2s ease-in-out infinite;
    }
    #boot .boot-dots i:nth-child(2) { animation-delay: 0.15s; }
    #boot .boot-dots i:nth-child(3) { animation-delay: 0.3s; }
    #boot.boot-fail { cursor: pointer; }
    #boot.boot-fail .boot-ring { animation: none; border-color: rgba(248, 113, 113, 0.35); border-top-color: #f87171; }
    #boot.boot-fail .boot-ic {
      animation: none;
      background: linear-gradient(160deg, #64748b, #334155);
      box-shadow: none;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes boot-dot {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-mark" aria-hidden="true">
      <div class="boot-ring"></div>
      <div class="boot-ic">♟</div>
    </div>
    <p class="boot-label">Doska ochilmoqda…</p>
    <p class="boot-sub">Shaxmat tayyorlanmoqda</p>
    <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="gate-icon">♟</div>
      <h1>Open from Telegram</h1>
      <p>This app works inside Telegram. Open the bot and tap <b>Play</b>.</p>
    </div>
  </div>

  <main id="app" hidden>
    <div id="bg" aria-hidden="true"></div>
    <div id="pager">
      <div id="track">
        <section class="page" data-page="play"></section>
        <section class="page" data-page="puzzles"></section>
        <section class="page" data-page="rankings"></section>
        <section class="page" data-page="live"></section>
        <section class="page" data-page="profile"></section>
      </div>
    </div>
    <div id="dock">
      <div id="play-sticky" aria-hidden="true"></div>
      <nav id="nav" aria-label="Main"><span id="nav-ind"></span></nav>
    </div>
    <div id="game" class="screen game" aria-hidden="true"></div>
    <div id="screen" class="screen" aria-hidden="true"></div>
    <div id="sheet-root"></div>
    <div id="toast" role="status"></div>
  </main>
  <script type="module" src="/js/app.js?v=20261015f"></script>
  <script>
    (function () {
      function failBoot(msg) {
        var b = document.getElementById('boot');
        if (!b || b.hidden) return;
        b.className = 'boot-fail';
        b.innerHTML =
          '<div class="boot-mark" aria-hidden="true"><div class="boot-ring"></div><div class="boot-ic">♟</div></div>' +
          '<p class="boot-label">' + (msg || 'Ilova ochilmadi') + '</p>' +
          '<p class="boot-sub">Qayta urinish uchun bosing</p>';
        b.onclick = function () { location.reload(); };
      }
      window.addEventListener('error', function () {
        var b = document.getElementById('boot');
        if (b && !b.hidden) failBoot('Yuklashda xato');
      });
      window.addEventListener('unhandledrejection', function () {
        var b = document.getElementById('boot');
        if (b && !b.hidden) failBoot('Ulanishda xato');
      });
      // Watchdog: never leave users on splash forever
      setTimeout(function () {
        var b = document.getElementById('boot');
        if (b && !b.hidden) failBoot('Juda uzoq kutildi');
      }, 16000);
    })();
  </script>
</body>
</html>
