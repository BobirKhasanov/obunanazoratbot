  <style>
    /* Inline boot splash (critical CSS) — paints before styles.css / telegram.org / modules */
    html, body { margin: 0; min-height: 100%; min-height: 100dvh; background: #0a0e17 radial-gradient(ellipse at 50% 0%, #152238 0%, #0a0e17 55%, #05080f 100%) no-repeat; color: var(--text, #fff); }
    #boot {
      --bt: calc(var(--tg-content-safe-area-inset-top, 0px) + var(--tg-safe-area-inset-top, 0px));
      position: fixed; inset: 0; z-index: 1000; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      padding: max(var(--bt), env(safe-area-inset-top, 0px)) 24px max(var(--tg-safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
      background: #0a0e17 radial-gradient(ellipse at 50% 0%, #152238 0%, #0a0e17 55%, #05080f 100%) no-repeat;
      color: #e8edf5; font: 600 14px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; text-align: center;
      opacity: 1; transition: opacity .26s ease;
    }
    #boot[hidden] { display: none !important; }
    #boot.boot-out { opacity: 0; pointer-events: none; }
    #boot > * { position: relative; }
    #boot .boot-art { position: absolute; left: 0; right: 0; top: 0; height: 64%; overflow: hidden; pointer-events: none; }
    #boot .boot-art img {
      display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;
      opacity: 0; transition: opacity .6s ease;
    }
    #boot .boot-art.on img { opacity: .3; }
    #boot .boot-art::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,14,23,.55) 0%, rgba(10,14,23,.2) 35%, #0a0e17 100%);
    }
    #boot .boot-mark { width: 112px; height: 112px; display: grid; place-items: center; margin-bottom: 4px; }
    #boot .boot-glow {
      position: absolute; inset: -10px; border-radius: 50%;
      background: radial-gradient(circle, rgba(46,139,255,.32) 0%, rgba(46,139,255,0) 68%);
      animation: boot-glow 2.4s ease-in-out infinite;
    }
    #boot .boot-orbit {
      position: absolute; inset: 4px; border-radius: 50%;
      border: 2px solid rgba(46,139,255,.14); border-top-color: #2e8bff;
      animation: boot-spin 1.1s linear infinite;
    }
    #boot .boot-orbit i { display: none; }
    #boot .boot-ic {
      width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center;
      background: linear-gradient(160deg, #4aa3ff 0%, #2e8bff 45%, #1f6fd6 100%);
      box-shadow: 0 12px 30px rgba(46,139,255,.35), inset 0 1px 0 rgba(255,255,255,.25);
      color: #fff;
    }
    #boot .boot-ic svg { width: 46px; height: 46px; display: block; fill: currentColor; }
    #boot .boot-app { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: #fff; }
    #boot .boot-card {
      width: min(300px, 100%); box-sizing: border-box; margin-top: 6px; padding: 16px 18px 18px;
      border-radius: 20px; background: rgba(21,29,41,.86); border: 1px solid rgba(255,255,255,.07);
      display: grid; gap: 6px; justify-items: center;
    }
    #boot .boot-label { margin: 0; font-size: 15px; font-weight: 750; color: #e8edf5; }
    #boot .boot-sub { margin: 0; font-size: 12.5px; font-weight: 600; color: #8b95a8; }
    #boot .boot-sub[hidden] { display: none; }
    #boot .boot-bar { width: 100%; height: 4px; margin-top: 8px; border-radius: 99px; background: rgba(46,139,255,.14); overflow: hidden; }
    #boot .boot-bar > i {
      display: block; width: 38%; height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, rgba(46,139,255,0), #2e8bff 40%, #7cc0ff);
      animation: boot-bar 1.2s cubic-bezier(.45,0,.35,1) infinite;
    }
    #boot .boot-retry {
      display: none; margin-top: 10px; min-width: 170px; padding: 12px 20px; border: 0; border-radius: 14px;
      background: #2e8bff; color: #fff; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 6px 18px rgba(46,139,255,.3); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    #boot .boot-retry:active { background: #1f6fd6; transform: scale(.98); }
    #boot[data-anim="pulse"] .boot-orbit, #boot[data-anim="bars"] .boot-orbit { display: none; }
    #boot[data-anim="pulse"] .boot-ic { animation: boot-pulse 1.4s ease-in-out infinite; }
    #boot[data-anim="bars"] .boot-glow { animation: none; opacity: .6; }
    #boot.boot-fail .boot-orbit, #boot.boot-fail .boot-bar { display: none; }
    #boot.boot-fail .boot-glow, #boot.boot-fail .boot-ic { animation: none; }
    #boot.boot-fail .boot-glow { opacity: .35; }
    #boot.boot-fail .boot-ic { background: linear-gradient(160deg, #3a4558, #222b3a); box-shadow: none; color: #c3cad6; }
    #boot.boot-fail .boot-retry { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes boot-glow { 0%, 100% { opacity: .5; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes boot-bar { 0% { transform: translateX(-105%); } 100% { transform: translateX(270%); } }
    /* Android / lite: keep only the transform-only spinner + bar */
    html[data-android="1"] #boot .boot-glow,
    html[data-android="1"] #boot .boot-ic { animation: none !important; }
    html[data-android="1"] #boot .boot-art img { transition: none; }
    @media (prefers-reduced-motion: reduce) {
      #boot, #boot .boot-art img { transition: none; }
      #boot .boot-glow, #boot .boot-orbit, #boot .boot-ic { animation: none !important; }
      #boot .boot-bar > i { animation: boot-breathe 1.6s ease-in-out infinite; width: 100%; }
    }
    @keyframes boot-breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

<body>

  <script>
    (function () {
      // Wake Render origin early (cold start) while splash paints
      try { fetch('/healthz', { cache: 'no-store', credentials: 'omit' }).catch(function () {}); } catch (e) {}
      var DEFAULTS = {
        en: { app: 'Chess', title: 'Loading game', subtitle: 'Please wait…', wake: 'Connecting to the server…', slow: 'Taking too long', err: 'Loading error', net: 'No connection', offline: 'You are offline', hint: 'Check your connection and try again', retry: 'Try again' },
        ru: { app: 'Шахматы', title: 'Игра загружается', subtitle: 'Подождите…', wake: 'Подключаемся к серверу…', slow: 'Слишком долгая загрузка', err: 'Ошибка загрузки', net: 'Нет соединения', offline: 'Нет интернета', hint: 'Проверьте соединение и попробуйте снова', retry: 'Повторить' },
        uz: { app: 'Shaxmat', title: "O'yin yuklanmoqda", subtitle: 'Iltimos kuting…', wake: 'Serverga ulanmoqda…', slow: 'Juda uzoq kutildi', err: 'Yuklashda xato', net: "Aloqa yo'q", offline: "Internet yo'q", hint: "Aloqani tekshirib, qayta urinib ko'ring", retry: 'Qayta urinish' },
        uzc: { app: 'Шахмат', title: 'Ўйин юкланмоқда', subtitle: 'Илтимос кутинг…', wake: 'Серверга уланмоқда…', slow: 'Жуда узоқ кутилди', err: 'Юклашда хато', net: 'Алоқа йўқ', offline: 'Интернет йўқ', hint: 'Алоқани текшириб, қайта уриниб кўринг', retry: 'Қайта уриниш' }
      };
      function detectLang() {
        try {
          var saved = localStorage.getItem('chess_lang');
          if (saved && DEFAULTS[saved]) return saved;
        } catch (e) {}
        try {
          var tw = window.Telegram && window.Telegram.WebApp;
          var code = (tw && tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code) || '';
          code = String(code).toLowerCase();
          if (code.indexOf('ru') === 0) return 'ru';
          if (code.indexOf('uz') === 0) return 'uz';
        } catch (e) {}
        return 'uz';
      }
      function $(id) { return document.getElementById(id); }
      function setText(id, s) { var el = $(id); if (el) { el.textContent = s || ''; el.hidden = !s; } }
      var lang = detectLang();
      var C = DEFAULTS[lang] || DEFAULTS.uz;
      function applyCopy(entry, anim) {
        var b = $('boot');
        if (!b || b.classList.contains('boot-fail')) return;
        if (entry && entry.title) setText('boot-label', entry.title);
        setText('boot-sub', entry && entry.subtitle);
        if (anim) b.setAttribute('data-anim', anim);
      }
      var adminSplash = null;
      function paintCopy() {
        setText('boot-app', C.app);
        setText('boot-retry', C.retry);
        var s = adminSplash;
        applyCopy(s ? (s[lang] || s.uz || s.en) : C, (s && s.animation) || 'orbit');
      }
      paintCopy();
      // Runs before telegram-web-app.js; re-detect once Telegram's language_code is known
      window.__bootRelang = function () {
        var next = detectLang();
        if (next === lang) return;
        lang = next;
        C = DEFAULTS[lang] || DEFAULTS.uz;
        paintCopy();
      };
      try {
        fetch('/api/public/boot-splash', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data || !data.splash) return;
            adminSplash = data.splash;
            paintCopy();
          })
          .catch(function () {});
      } catch (e) {}

      function bootEl() { return $('boot'); }
      function bootStillUp() {
        var b = bootEl();
        return !!(b && document.body.contains(b) && !b.hidden && b.style.display !== 'none' && !b.classList.contains('boot-out'));
      }
      /** Fade the splash out over the already-revealed app, then drop it from the DOM. */
      function leaveBoot() {
        var b = bootEl();
        if (!b || b.classList.contains('boot-out')) return;
        b.classList.add('boot-out');
        b.setAttribute('aria-hidden', 'true');
        function kill() {
          try {
            b.hidden = true;
            b.style.setProperty('display', 'none', 'important');
            b.remove();
          } catch (e) {}
        }
        var still = false;
        try { still = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        if (still) kill(); else setTimeout(kill, 300);
      }
      function forceLeaveSplash() {
        var b = bootEl();
        if (!b || !document.body.contains(b)) return;
        if (b.classList.contains('boot-fail')) return;
        var tw = window.Telegram && window.Telegram.WebApp;
        var app = $('app');
        var gate = $('gate');
        if (tw && tw.initData) {
          if (gate) gate.hidden = true;
          if (app) { app.hidden = false; app.removeAttribute('hidden'); }
        } else {
          if (app) app.hidden = true;
          if (gate) gate.hidden = false;
        }
        leaveBoot();
      }
      /** kind: 'net' | 'offline' | 'err' | 'slow' — swaps the status card to an error + retry button. */
      function failBoot(kind) {
        var b = bootEl();
        if (!b || !bootStillUp() || b.classList.contains('boot-fail')) return false;
        if (kind !== 'slow' && kind !== 'err' && navigator.onLine === false) kind = 'offline';
        b.classList.add('boot-fail');
        b.setAttribute('role', 'alert');
        setText('boot-label', C[kind] || C.err);
        setText('boot-sub', C.hint);
        var btn = $('boot-retry');
        if (btn) {
          btn.onclick = function () { btn.disabled = true; location.reload(); };
          try { btn.focus({ preventScroll: true }); } catch (e) {}
        }
        if (kind === 'offline') {
          window.addEventListener('online', function () { location.reload(); }, { once: true });
        }
        return true;
      }
      window.__bootLeave = leaveBoot;
      window.__bootFail = failBoot;
      window.__bootStatus = function (kind) {
        var b = bootEl();
        if (!b || !bootStillUp() || b.classList.contains('boot-fail')) return;
        if (kind === 'wake') setText('boot-sub', C.wake);
      };
      // Only force-leave when home already painted (do not flash empty shell at 2.5s)
      function forceLeaveIfHomeReady() {
        var play = document.querySelector('.page[data-page="play"]');
        if (play && play.childElementCount > 0) forceLeaveSplash();
      }
      setTimeout(forceLeaveIfHomeReady, 4000);
      setTimeout(forceLeaveIfHomeReady, 8000);
      window.addEventListener('error', function (ev) {
        if (!bootStillUp()) return;
        var src = '';
        try {
          src = String((ev && ev.filename) || (ev && ev.target && (ev.target.src || ev.target.href)) || '');
        } catch (e) { src = ''; }
        if (src.indexOf('/js/entry.js') === -1) return;
        failBoot('err');
      }, true);
      setTimeout(function () {
        if (!bootStillUp()) return;
        var play = document.querySelector('.page[data-page="play"]');
        if (play && play.childElementCount > 0) forceLeaveSplash();
        else failBoot('slow');
      }, 42000);
    })();
  </script>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Earliest possible ready/expand — don't wait for modules or /me */
    (function () {
      try {
        var tw = window.Telegram && window.Telegram.WebApp;
        var ua = navigator.userAgent || '';
        var plat = String((tw && tw.platform) || '').toLowerCase();
        if (plat === 'android' || /Android/i.test(ua)) {
          document.documentElement.setAttribute('data-android', '1');
        }
        if (plat === 'ios' || /iPhone|iPad|iPod/i.test(ua)) {
          document.documentElement.setAttribute('data-ios', '1');
        }
        try { if (window.__bootRelang) window.__bootRelang(); } catch (e) {}
        if (!tw) return;
        tw.ready();
        try { tw.expand(); } catch (e) {}
        try { if (tw.disableVerticalSwipes) tw.disableVerticalSwipes(); } catch (e) {}
      } catch (e) {}
    })();
  </script>
